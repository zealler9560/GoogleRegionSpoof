name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK platform 35 and build-tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDK_ROOT/platforms/android-35/android.jar" ]; then
            yes | "$SDKMANAGER" "platforms;android-35" >/dev/null
          fi
          if [ ! -d "$SDK_ROOT/build-tools" ] || [ -z "$(ls -A "$SDK_ROOT/build-tools" 2>/dev/null)" ]; then
            yes | "$SDKMANAGER" "build-tools;35.0.0" >/dev/null
          fi

      - name: Prepare signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KS=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=$KEYSTORE_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASS=${KEY_PASS:-$KEYSTORE_PASS}" >> "$GITHUB_ENV"
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -keypass android \
              -alias debugkey -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=GoogleRegionSpoof, OU=Dev, O=Community, L=Unknown, S=Unknown, C=US"
            echo "KS=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
            echo "KS_PASS=android" >> "$GITHUB_ENV"
            echo "KEY_PASS=android" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: sh ./build.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GoogleRegionSpoof-apk
          path: build/GoogleRegionSpoof-*.apk
          if-no-files-found: error
